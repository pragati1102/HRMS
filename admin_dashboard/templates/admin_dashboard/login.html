<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | HRMS Admin Dashboard</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            font-family: var(--font-family);
            background: radial-gradient(circle at 50% 50%, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 20px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.1);
            max-width: 420px;
            width: 100%;
            padding: 40px;
            transition: all 0.3s ease;
        }

        .login-card:hover {
            box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.15);
        }

        .brand-icon {
            background: var(--primary-gradient);
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(99, 102, 241, 0.25);
            color: white;
            font-size: 1.75rem;
        }

        .btn-premium {
            background: var(--primary-gradient);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn-premium:hover {
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.3);
        }

        .form-control {
            border-radius: 12px;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        .form-control:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="brand-icon">
            <!-- Rocket icon representation -->
            <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="currentColor" class="bi bi-rocket-takeoff-fill" viewBox="0 0 16 16">
                <path d="M12.17 9.53c-.077-.166-.16-.32-.25-.463-.223-.353-.54-.643-.933-.856a.5.5 0 0 0-.44.875c.272.138.487.329.623.542.062.1.116.204.16.314A5 5 0 0 0 12.17 9.53m-.96 2.057c.07-.123.13-.254.18-.39a5 5 0 0 0-.25-1.41 5 5 0 0 0-.17-.324.5.5 0 1 0-.866.5c.06.104.11.213.153.327.038.102.067.208.087.317q.015.084.02.169a.5.5 0 0 0 .85.31"/>
                <path d="M10.116 1.735a.8.8 0 0 0-1.112-1.112L6.155 3.472A2 2 0 0 0 5.2 5.011L4 6H2a2 2 0 0 0-2 2v2a2 2 0 0 0 2 2h2l1.2.989a2 2 0 0 0 1.547.456l2.85-2.851A.8.8 0 0 0 10.116 1.735M8 5a1 1 0 1 1-2 0 1 1 0 0 1 2 0"/>
                <path d="M10.5 8a2.5 2.5 0 1 1-5 0 2.5 2.5 0 0 1 5 0"/>
            </svg>
        </div>
        
        <h4 class="text-center fw-bold text-dark mb-1">Welcome Back</h4>
        <p class="text-center text-muted small mb-4">HRMS Admin Portal</p>
        
        {% if form.errors %}
            <div class="alert alert-danger rounded-3 py-2 px-3 small mb-3" role="alert">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_username" class="form-label small fw-semibold text-secondary">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" placeholder="Enter username" required autofocus>
            </div>
            
            <div class="mb-4">
                <label for="id_password" class="form-label small fw-semibold text-secondary">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" placeholder="Enter password" required>
            </div>
            
            <button type="submit" class="btn btn-premium">Sign In</button>
        </form>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
