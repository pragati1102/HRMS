{% if avatar_user.profile_photo %}
    <img src="{% if avatar_user.id == request.user.id %}{% url 'employee_profile_photo' %}{% else %}{% url 'employee_photo_by_id' avatar_user.id %}{% endif %}"
         alt="{{ avatar_user.get_full_name|default:avatar_user.username }} profile photo"
         style="display: block; width: 100%; height: 100%; object-fit: cover; border-radius: inherit;">
{% else %}
    <span role="img"
          aria-label="{{ avatar_user.get_full_name|default:avatar_user.username }} initials"
          style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; border-radius: inherit; background: #eef2ff; color: #4f46e5; font-size: 1.1rem; font-weight: 700; letter-spacing: 0.04em; line-height: 1;">
        {% if avatar_user.first_name %}
            {{ avatar_user.first_name|first|upper }}{% if avatar_user.last_name %}{{ avatar_user.last_name|first|upper }}{% endif %}
        {% else %}
            {{ avatar_user.username|first|upper }}
        {% endif %}
    </span>
{% endif %}
